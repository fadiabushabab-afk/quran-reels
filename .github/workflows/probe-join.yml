name: Probe join (temporary)
on:
  push:
    branches: [probe-join]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt matplotlib
      - run: python probe_join.py | tee probe/edges.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f probe; git commit -qm "probe results [skip ci]"; git push
