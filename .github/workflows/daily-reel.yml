name: Daily Quran reel

on:
  schedule:
    - cron: "0 15 * * *"      # 15:00 UTC = 18:00 Baghdad
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      reciter:
        description: "Reciter key (or random)"
        default: "random"
      publish:
        description: "Post this video?"
        type: boolean
        default: false
      platforms:
        description: "Where to post (comma separated)"
        default: "instagram,facebook"
      date:
        description: "Test only: pretend today is YYYY-MM-DD (empty = real date)"
        default: ""

permissions:
  contents: write             # to commit history.json

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate reel
        id: gen
        run: |
          python -c "from PIL import features; print('raqm:', features.check('raqm'))"
          set +e
          python generate.py --reciter "${{ github.event.inputs.reciter || 'random' }}" \
                             ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
                             --handle "${{ vars.HANDLE || '@quran_reflections_waqf' }}" 2> err.txt
          code=$?
          set -e
          cat err.txt
          if [ $code -ne 0 ]; then
            echo "::error title=generate.py failed::$(tail -c 1500 err.txt | tr '\n' ' ')"
            exit $code
          fi
          cat out/caption.txt

      - name: Save video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Publish to Instagram / Facebook
        id: pub
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'instagram,facebook' }}
        run: python publish.py out


      - name: Remember used passage
        # a failed post is not recorded, so the same passage is retried next time
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && steps.pub.outcome != 'failure' }}
        run: |
          git config user.name  "quran-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git commit -m "history: $(cat out/meta.json | tr -d '\n')" || true
          git push
