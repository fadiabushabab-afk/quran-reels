name: Daily Quran reel

on:
  schedule:
    - cron: "0 15 * * *"      # 15:00 UTC = 18:00 Baghdad
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      reciter:
        description: "Reciter key (or random)"
        default: "random"

permissions:
  contents: write             # to commit history.json

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate reel
        run: |
          python generate.py --reciter "${{ github.event.inputs.reciter || 'random' }}" \
                             --handle "${{ vars.HANDLE }}"
          cat out/caption.txt

      - name: Save video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 14

      # Posting to Facebook / Instagram / TikTok is added in a later step.

      - name: Remember used passage
        run: |
          git config user.name  "quran-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git commit -m "history: $(cat out/meta.json | tr -d '\n')" || true
          git push
