name: Daily Quran reel

on:
  schedule:
    - cron: "7 15 * * 0-4,6"  # 18:07 Baghdad, Saturday-Thursday (off the hour: :00 jobs are often delayed)
    - cron: "7 6 * * 5"       # 09:07 Baghdad on Friday, so Al-Kahf goes out within Friday (ends at Maghrib)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      reciter:
        description: "Reciter key (or random)"
        default: "random"
      publish:
        description: "Post this video?"
        type: boolean
        default: false
      platforms:
        description: "Where to post (comma separated)"
        default: "instagram,facebook"
      date:
        description: "Test only: pretend today is YYYY-MM-DD (empty = real date)"
        default: ""
      background:
        description: "Test only: force one file from backgrounds/ (empty = normal rotation)"
        default: ""
      verses:
        description: "Test only: a specific passage, e.g. 2:255 (empty = normal rotation; never recorded)"
        default: ""

permissions:
  contents: write             # to commit history.json

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate reel
        id: gen
        run: |
          python -c "from PIL import features; print('raqm:', features.check('raqm'))"
          set +e
          python generate.py --reciter "${{ github.event.inputs.reciter || 'random' }}" \
                             ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
                             ${{ github.event.inputs.background && format('--bg-file {0}', github.event.inputs.background) || '' }} \
                             ${{ github.event.inputs.verses && format('--verses {0}', github.event.inputs.verses) || '' }} \
                             --handle "${{ vars.HANDLE || '@quran_reflections_waqf' }}" 2> err.txt
          code=$?
          set -e
          cat err.txt
          if [ $code -ne 0 ]; then
            echo "::error title=generate.py failed::$(tail -c 1500 err.txt | tr '\n' ' ')"
            exit $code
          fi
          cat out/caption.txt

      - name: Save video as a downloadable artifact
        uses: actions/upload-artifact@v6
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Publish to Instagram / Facebook
        id: pub
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'instagram,facebook' }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}          # optional public repo for the Instagram fallback
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: python publish.py out     # also commits history.json when something was posted
